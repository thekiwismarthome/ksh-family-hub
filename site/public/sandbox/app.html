    {id:'c3',name:'Vacuum',emoji:'🧹',points:3,assignees:['p3','p2'],recurrence:{type:'daily'},due_time:null,remind:false,requires_approval:true,active:true},
    {id:'c4',name:'Water the plants',emoji:'🪴',points:1,assignees:['p4'],recurrence:{type:'weekly',days:[0,1,2,3,4,5,6]},due_time:null,remind:false,requires_approval:true,active:true}],

    inst:{['c1:'+T]:{status:'done',done_by:'p2',done_at:'x',points:0},['c2:'+T]:{status:'approved',done_by:'p3',points:2}},
    runs:{'r1:p2':{steps:['s1'],completed:false}},ledger:[{id:'l1',person_id:'p3',points:2,reason:'🐶 Feed the pets',at:new Date().toISOString()},{id:'l2',person_id:'p2',points:5,reason:'Bonus',at:new Date().toISOString()}]};
  ch.cel={p3:'fireworks'};
  ch.rewards=[{id:'w1',name:'Extra screen time (30 minutes)',emoji:'📺',cost:15,active:true},{id:'w2',name:'Ice cream treat',emoji:'🍦',cost:25,active:true},{id:'w3',name:'Choose what is for dinner',emoji:'🍽️',cost:20,active:true},{id:'w4',name:'New small toy or book',emoji:'🧩',cost:100,active:true}];
  ch.reds=[{id:'q1',reward_id:'w1',name:'Extra screen time (30 minutes)',emoji:'📺',cost:15,person_id:'p3',status:'requested',at:new Date().toISOString()}];
  ch.pocket={p2:{enabled:true,period:'week',points:20,amount:500,account:'bank',since:'2026-11-01',settled:null}};
  ch.phist=[{person_id:'p2',start:'2026-11-09',end:'2026-11-16',earned:24,target:20,amount:500,paid:true,account:'bank'},{person_id:'p2',start:'2026-11-16',end:'2026-11-23',earned:11,target:20,amount:500,paid:false,account:'bank'}];
  const actorOf0=null;
  const actorOf=m=>people.find(p=>p.id===(m.as_person||'p1'));
  const mut=(m,adultOnly,fn)=>{const a=actorOf(m);if(adultOnly&&a.role!=='adult')return Promise.reject({message:'Only an adult can do that'});try{return Promise.resolve(fn(a)||{ok:true})}catch(e){return Promise.reject({message:e.message})}};
  const bal=()=>{const b={};ch.ledger.forEach(e=>b[e.person_id]=(b[e.person_id]||0)+e.points);return b};
  function chores(t,m){
    const c=t.slice(11);
    if(c==='subscribe')return Promise.resolve({subscribed:true});
    if(c==='get_state'){const day=m.date||iso;
      const items=ch.chores.filter(x=>x.active&&!(x.start&&x.start>day)).map(x=>{const i=ch.inst[x.id+':'+day];return {chore_id:x.id,date:day,status:i?i.status:'open',done_by:i?.done_by||null,points:i?.points||0,note:i?.note||null}});
      const pending=Object.entries(ch.inst).filter(([k,v])=>v.status==='done').map(([k,v])=>({chore_id:k.split(':')[0],date:k.split(':')[1],status:'done',done_by:v.done_by}));
      const y=new Date();y.setDate(y.getDate()-1);const yi=`${y.getFullYear()}-${p(y.getMonth()+1)}-${p(y.getDate())}`;
      const overdue=ch.chores.filter(x=>x.id==='c3'&&!ch.inst[x.id+':'+yi]).map(x=>({chore_id:x.id,date:yi,status:'open',done_by:null,points:0,note:null}));
      return Promise.resolve({date:day,today:iso,chores:ch.chores,routines:ch.routines,items,overdue,pending,runs:ch.runs,balances:bal(),history:[...ch.ledger].reverse(),celebrations:{...ch.cel},rewards:ch.rewards,redemptions:ch.reds,pocket:Object.fromEntries(Object.entries(ch.pocket).map(([k,v])=>[k,{...v,start:'2026-11-23',end:'2026-11-30',earned:ch.ledger.filter(e=>e.person_id===k).reduce((n,e)=>n+e.points,0)+9,starts_next:false}])),pocket_history:ch.phist});}
    if(c==='get_range'){const items=[];for(let d=new Date(m.start+'T12:00');d<=new Date(m.end+'T12:00');d.setDate(d.getDate()+1)){const k=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;ch.chores.forEach(x=>{if(x.active&&(x.id==='c2'||x.id==='c3'||(x.id==='c1'&&d.getDay()%2===0)))items.push({chore_id:x.id,date:k,status:(ch.inst[x.id+':'+k]||{}).status||'open'})})}return Promise.resolve({items,chores:ch.chores.map(x=>({id:x.id,name:x.name,emoji:x.emoji,assignees:x.assignees,due_time:x.due_time,points:x.points}))});}
    if(c==='complete')return mut(m,false,a=>{const k=m.chore_id+':'+(m.date||iso);const x=ch.chores.find(z=>z.id===m.chore_id);const adult=a.role==='adult';
      ch.inst[k]={status:adult?'approved':'done',done_by:a.id,points:adult?x.points:0};if(adult)ch.ledger.push({id:'n'+Math.random(),person_id:a.id,points:x.points,reason:x.emoji+' '+x.name,at:new Date().toISOString()});return {status:adult?'approved':'done',awarded:adult,celebration:ch.cel[a.id]||'tape'}});
    if(c==='approve')return mut(m,true,a=>{const k=m.chore_id+':'+(m.date||iso);const i=ch.inst[k];const x=ch.chores.find(z=>z.id===m.chore_id);i.status='approved';i.points=x.points;ch.ledger.push({id:'n'+Math.random(),person_id:i.done_by,points:x.points,reason:x.emoji+' '+x.name,at:new Date().toISOString()});return {status:'approved',awarded:true}});
    if(c==='reject')return mut(m,true,a=>{ch.inst[m.chore_id+':'+(m.date||iso)]={status:'rejected',note:m.note}});
    if(c==='reopen')return mut(m,false,a=>{delete ch.inst[m.chore_id+':'+(m.date||iso)]});
    if(c==='chores/add')return mut(m,true,a=>{const x={id:'c'+Math.random(),active:true,remind:false,requires_approval:true,...m};delete x.type;delete x.id2;ch.chores.push(x);return {chore:x}});
    if(c==='chores/update')return mut(m,true,a=>{Object.assign(ch.chores.find(z=>z.id===m.chore_id),m);return {}});
    if(c==='chores/delete')return mut(m,true,a=>{ch.chores=ch.chores.filter(z=>z.id!==m.chore_id)});
    if(c==='routines/add')return mut(m,true,a=>{ch.routines.push({id:'r'+Math.random(),active:true,...m,steps:m.steps.map((s,i)=>({id:'s'+i+Math.random(),...s}))})});
    if(c==='routines/update')return mut(m,true,a=>{Object.assign(ch.routines.find(z=>z.id===m.routine_id),m)});
    if(c==='routines/delete')return mut(m,true,a=>{ch.routines=ch.routines.filter(z=>z.id!==m.routine_id)});
    if(c==='routines/step')return mut(m,false,a=>{const r=ch.routines.find(z=>z.id===m.routine_id);const wp=m.for_person||a.id;const k=r.id+':'+wp;const run=ch.runs[k]||(ch.runs[k]={steps:[],completed:false});
      if(m.done&&!run.steps.includes(m.step_id))run.steps.push(m.step_id);if(!m.done)run.steps=run.steps.filter(x=>x!==m.step_id);let aw=false;
      const wd=(new Date().getDay()+6)%7;const todays=r.steps.filter(z=>!(z.days||[]).length||z.days.includes(wd));if(todays.every(z=>run.steps.includes(z.id))&&!run.completed){run.completed=true;aw=true;ch.ledger.push({id:'n'+Math.random(),person_id:wp,points:r.points,reason:r.emoji+' '+r.name,at:new Date().toISOString()})}return {steps:run.steps,completed:run.completed,awarded:aw,celebration:ch.cel[a.id]||'tape'}});
    if(c==='celebration/set')return mut(m,false,a=>{const pid=m.person_id||a.id;if(pid!==a.id&&a.role!=='adult')throw new Error('You can only change your own celebration');ch.cel[pid]=m.style;return {celebrations:ch.cel}});
    if(c==='rewards/add')return mut(m,true,a=>{ch.rewards.push({id:'w'+Math.random(),active:true,...m});});
    if(c==='rewards/update')return mut(m,true,a=>{Object.assign(ch.rewards.find(z=>z.id===m.reward_id),m)});
    if(c==='rewards/delete')return mut(m,true,a=>{ch.rewards=ch.rewards.filter(z=>z.id!==m.reward_id)});
    if(c==='redeem')return mut(m,false,a=>{const w=ch.rewards.find(z=>z.id===m.reward_id);const bal0=bal()[a.id]||0;if(bal0<w.cost)throw new Error('Not enough points yet');
      if(a.role==='adult'){ch.ledger.push({id:'n'+Math.random(),person_id:a.id,points:-w.cost,reason:w.emoji+' '+w.name,at:new Date().toISOString()});return {status:'approved'}}
      ch.reds.push({id:'q'+Math.random(),reward_id:w.id,name:w.name,emoji:w.emoji,cost:w.cost,person_id:a.id,status:'requested',at:new Date().toISOString()});return {status:'requested'}});
    if(c==='redemptions/approve')return mut(m,true,a=>{const r=ch.reds.find(z=>z.id===m.redemption_id);r.status='approved';ch.ledger.push({id:'n'+Math.random(),person_id:r.person_id,points:-r.cost,reason:r.emoji+' '+r.name,at:new Date().toISOString()});return {status:'approved'}});
    if(c==='redemptions/decline')return mut(m,true,a=>{ch.reds.find(z=>z.id===m.redemption_id).status='declined';return {status:'declined'}});
    if(c==='redemptions/cancel')return mut(m,false,a=>{ch.reds=ch.reds.filter(z=>z.id!==m.redemption_id)});
    if(c==='pocket/set')return mut(m,true,a=>{ch.pocket[m.person_id]={...(ch.pocket[m.person_id]||{}),...m};delete ch.pocket[m.person_id].type;return {pocket:ch.pocket[m.person_id]}});
    if(c==='points/adjust')return mut(m,true,a=>{ch.ledger.push({id:'n'+Math.random(),person_id:m.person_id,points:m.points,reason:m.reason||'Adjustment',at:new Date().toISOString()})});
    return Promise.resolve({});
  }
  // ---- calendar mock ----
  const dd=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
  let cal={events:[
    {id:'e1',title:'Swimming lessons',emoji:'🏊',category:'sport',people:['p2'],date:dd(-14),end_date:null,all_day:false,start_time:'16:00',end_time:'17:00',repeat:{type:'weekly',days:[1,3]},location:'Aquatic Centre',notes:'',remind:30},
    {id:'e2',title:'Dentist: Mia',emoji:'🦷',category:'medical',people:['p2'],date:dd(2),end_date:null,all_day:false,start_time:'10:30',end_time:'11:15',repeat:{type:'none'},location:'Smile Dental',notes:'Bring the card',remind:60},
    {id:'e3',title:'School disco',emoji:'🎉',category:'school',people:['p2','p3'],date:dd(4),end_date:null,all_day:false,start_time:'18:00',end_time:'20:00',repeat:{type:'none'},location:'School hall',notes:'',remind:null},
    {id:'e4',title:'Leo birthday',emoji:'🎂',category:'birthday',people:[],date:dd(9),end_date:null,all_day:true,start_time:null,end_time:null,repeat:{type:'yearly'},location:'',notes:'',remind:null},
    {id:'e5',title:'Year 5 camp',emoji:'🏕️',category:'school',people:['p3'],date:dd(6),end_date:dd(8),all_day:true,start_time:null,end_time:null,repeat:{type:'none'},location:'Lake Taupō',notes:'',remind:null},
    {id:'e6',title:'Parents evening',emoji:'📚',category:'school',people:['p1'],date:dd(0),end_date:null,all_day:false,start_time:'19:00',end_time:null,repeat:{type:'none'},location:'',notes:'',remind:0}],
    settings:{ha_calendars:['calendar.public_holidays'],show_chores:true}};
  const occ=(e,day)=>{const s=new Date(e.date+'T12:00'),d=new Date(day+'T12:00');if(d<s)return false;const t=e.repeat.type;
    if(t==='none')return day<=(e.end_date||e.date);if(t==='weekly')return (e.repeat.days||[]).includes((d.getDay()+6)%7);if(t==='yearly')return d.getMonth()===s.getMonth()&&d.getDate()===s.getDate();if(t==='daily')return true;return false};
  function calendar(t,m){const c=t.slice(13);
    if(c==='subscribe')return Promise.resolve({subscribed:true});
    if(c==='get_events'){const out=[];for(let d=new Date(m.start+'T12:00');d<=new Date(m.end+'T12:00');d.setDate(d.getDate()+1)){const k=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;cal.events.forEach(e=>{if(occ(e,k))out.push({...e,event_id:e.id,occurs:k})})}return Promise.resolve({events:out,settings:cal.settings})}
    const a=actorOf(m);if(a.role!=='adult')return Promise.reject({message:'Only an adult can change the calendar'});
    if(c==='events/add'){const e={id:'e'+Math.random(),...m};delete e.type;delete e.id2;cal.events.push(e);return Promise.resolve({event:e})}
    if(c==='events/update'){Object.assign(cal.events.find(z=>z.id===m.event_id),m);return Promise.resolve({})}
    if(c==='events/delete'){cal.events=cal.events.filter(z=>z.id!==m.event_id);return Promise.resolve({})}
    if(c==='settings/set'){Object.assign(cal.settings,m);delete cal.settings.type;return Promise.resolve({settings:cal.settings})}
    return Promise.resolve({})}
  // ---- finance mock ----
  let fin={tx:[]};const fid=()=>'f'+Math.random().toString(36).slice(2,8);
  const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString()};
  const addTx=(g,p,acc,amt,kind,note,emoji,at,by)=>fin.tx.push({id:fid(),group:g,person_id:p,account:acc,amount:amt,kind,note,emoji,at,by,key:null,void:false});
  addTx('g1','p2','bank',2000,'deposit','Birthday money','🎂',ago(20),'p1');addTx('g2','p2','cash',1500,'deposit','Gran visit','💵',ago(14),'p1');
